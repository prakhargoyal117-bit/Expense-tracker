<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sv-base" x1="36" y1="24" x2="476" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="55%" stop-color="#0B4F4A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="sv-gold" x1="312" y1="96" x2="420" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sv-ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- Outer rounded vault chassis -->
  <rect width="512" height="512" rx="116" fill="url(#sv-base)" />
  <rect
    x="22"
    y="22"
    width="468"
    height="468"
    rx="96"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="6"
  />

  <!-- Mechanical encrypted vault dial ring (broken arc for open-entry geometric motif) -->
  <path
    d="M368 144A160 160 0 1 1 256 96"
    stroke="url(#sv-ring)"
    stroke-width="24"
    stroke-linecap="round"
  />

  <!-- 3 Vault locking lugs at left, bottom, right -->
  <rect x="76" y="242" width="38" height="28" rx="14" fill="#5EEAD4" />
  <rect x="242" y="398" width="28" height="38" rx="14" fill="#2DD4BF" />
  <rect x="398" y="242" width="38" height="28" rx="14" fill="#2DD4BF" />

  <!-- Warm amber vault key-pin accent in upper-right dial notch -->
  <circle cx="364" cy="148" r="34" fill="url(#sv-gold)" />
  <circle cx="364" cy="148" r="13" fill="#0F172A" />

  <!-- Inner safe face plate -->
  <circle cx="256" cy="256" r="118" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Bespoke geometric Rupee + Ledger Vault Monogram -->
  <path
    d="M202 188H310"
    stroke="#FFFFFF"
    stroke-width="26"
    stroke-linecap="round"
  />
  <path
    d="M202 232H302"
    stroke="#FFFFFF"
    stroke-width="24"
    stroke-linecap="round"
  />
  <path
    d="M242 188C272 188 292 206 292 232C292 258 272 276 242 276H206L288 344"
    stroke="#FFFFFF"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
